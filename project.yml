# Fallback: regenerate BlankSpaces.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Only needed if the checked-in .xcodeproj gives you trouble:
#   brew install xcodegen && xcodegen
name: BlankSpaces
options:
  bundleIdPrefix: com.blankspaces
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: T342J8UQGV
    CODE_SIGN_STYLE: Automatic
targets:
  BlankSpaces:
    type: application
    platform: iOS
    sources:
      - BlankSpaces
      - Shared
    info:
      path: Config/BlankSpaces-Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.sahiti.less
            CFBundleURLSchemes: [less]
    entitlements:
      path: Config/BlankSpaces.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sahiti.less]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahiti.less
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BlankWidgetsExtension
        embed: true
  BlankWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - BlankWidgets
      - Shared
    info:
      path: Config/BlankWidgets-Info.plist
      properties:
        CFBundleDisplayName: Less
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/BlankWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sahiti.less]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahiti.less.widgets
        SKIP_INSTALL: true
